name: Build fork repo

# Builds only the extensions listed in MODULES and publishes them to this fork's
# `repo` branch, so the fork can be added to the app as an extension repo.

on:
  push:
    branches:
      - main
    paths:
      - 'src/en/comix/**'
      - '.github/workflows/build_fork.yml'
  workflow_dispatch:
    inputs:
      delete:
        description: JSON list of modules to remove from the published index, e.g. ["en.comixtest"]
        default: '[]'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  MODULES: ':src:en:comix'

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare signing key
        working-directory: main
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build extensions
        working-directory: main
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=()
          for module in $MODULES; do
            TASKS+=("${module}:assembleRelease")
          done
          ./gradlew "${TASKS[@]}"

      - name: Collect build outputs
        working-directory: main
        run: |
          mkdir -p ~/apk-artifacts
          find . -path '*/build/keiyoushi-source-info.json' \
            -o -path '*/build/outputs/apk/release/*.apk' \
            -o -path '*/build/outputs/jar/release/*.jar' \
            | xargs cp --parents -t ~/apk-artifacts
          find ~/apk-artifacts -type f

      - name: Clean up signing key
        if: always()
        run: rm -f main/signingkey.jks

      - name: Checkout repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repo
          path: repo
          persist-credentials: true

      - name: Publish and deploy repo
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REPO: ${{ github.repository }}
          INDEX_NAME: ${{ github.repository_owner }} (PR test)
          INDEX_BADGE: TEST
          DELETE: ${{ inputs.delete || '[]' }}
          # SHA-256 of the certificate in the SIGNING_KEY secret, must match repo.json
          INDEX_SIGNING_KEY: 52aaba8890554cbb49f7e6872f2956243e7193d0efd368b288b467f42102aa74
        run: |
          pip install protobuf
          python -u ../main/.github/scripts/publish-repo.py "$DELETE" "$GITHUB_SHA" "false"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update extensions repo"
            git push
          else
            echo "No changes to commit"
          fi
